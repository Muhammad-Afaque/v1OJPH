<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnlineJobs.ph — Job Board</title>
<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #1c2128;
  --border: #21262d;
  --text-primary: #e1e4e8;
  --text-secondary: #8b949e;
  --text-muted: #484f58;
  --accent: #58a6ff;
  --green: #3fb950;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.header {
  height: 3.5rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 1rem; gap: 1rem;
}
.header .brand { font-weight: 700; color: var(--accent); font-size: 0.95rem; }
.header .stats { margin-left: auto; font-size: 0.75rem; color: var(--text-secondary); }
.container { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
.toolbar {
  display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap;
}
.toolbar input, .toolbar select {
  padding: 0.4rem 0.6rem; background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text-primary); font-size: 0.8rem; outline: none;
}
.toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
.toolbar input[type="text"] { flex: 1; min-width: 200px; }
.job-card {
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px;
  padding: 0.75rem 1rem; margin-bottom: 0.5rem; cursor: pointer; transition: border-color 0.15s;
}
.job-card:hover { border-color: var(--accent); }
.job-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; }
.job-meta {
  display: flex; gap: 0.75rem; font-size: 0.72rem; color: var(--text-secondary); flex-wrap: wrap;
}
.job-meta .salary { color: var(--green); font-weight: 500; }
.badge {
  display: inline-block; padding: 1px 6px; border-radius: 8px;
  font-size: 0.62rem; font-weight: 600; background: var(--bg-tertiary); color: var(--accent);
}
.pagination {
  display: flex; justify-content: center; gap: 0.3rem; margin-top: 1.5rem; flex-wrap: wrap;
}
.pagination button {
  padding: 0.3rem 0.6rem; background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text-secondary); font-size: 0.75rem; cursor: pointer;
}
.pagination button:hover { border-color: var(--accent); color: var(--accent); }
.pagination button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.pagination button:disabled { opacity: 0.3; cursor: default; }
.loading { text-align: center; padding: 2rem; color: var(--text-muted); }
</style>
</head>
<body>

<div class="header">
  <div class="brand">OnlineJobs.ph</div>
  <div class="stats" id="stats">Loading...</div>
</div>

<div class="container">
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search jobs...">
    <select id="category">
      <option value="">All Categories</option>
    </select>
    <select id="sort">
      <option value="posted">Newest</option>
      <option value="title">Title</option>
      <option value="company">Company</option>
    </select>
  </div>

  <div id="jobList" class="loading">Loading jobs...</div>
  <div id="pagination" class="pagination"></div>
</div>

<script>
const state = { page: 1, limit: 20, search: '', category: '', sort: 'posted' };
let allJobs = [];
let totalJobs = 0;

// Data source is committed chunk files (Vercel serves them statically).
// Load every chunk_NNN.json in parallel; a missing/failed chunk just yields [].
async function loadAllJobs() {
  const loadChunk = async (i) => {
    const num = String(i).padStart(3, '0');
    try {
      const r = await fetch(`chunks/chunk_${num}.json`);
      if (!r.ok) return [];
      const chunk = await r.json();
      return Array.isArray(chunk) ? chunk : [];
    } catch { return []; }
  };
  // Plenty of headroom; extra chunks simply resolve to [].
  const results = await Promise.all(Array.from({ length: 60 }, (_, i) => loadChunk(i + 1)));
  allJobs = results.flat();
  totalJobs = allJobs.length;
  if (!totalJobs) throw new Error('No data loaded');
}

const CATEGORY_ORDER = ['VA', 'Marketing', 'Design', 'Development', 'Sales', 'Finance', 'Writing', 'Medical', 'Real Estate', 'Other'];

function jobDate(j) {
  const d = j.posted || j.scraped_at;
  if (!d || d === 'N/A') return null;
  const s = String(d).trim();
  const dt = new Date(s.endsWith('Z') || s.includes('+') ? s : s.replace(' ', 'T') + 'Z');
  return isNaN(dt.getTime()) ? null : dt.getTime();
}

function filterJobs() {
  const query = state.search.toLowerCase();
  const filtered = allJobs.filter(j => {
    if (state.category && (j.category || 'Other') !== state.category) return false;
    if (!query) return true;
    const hay = [
      j.title, j.job_title, j.company, j.description, j.salary, j.salary_detail,
    ].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(query);
  });

  filtered.sort((a, b) => {
    if (state.sort === 'title') return (a.title || a.job_title || '').localeCompare(b.title || b.job_title || '');
    if (state.sort === 'company') return (a.company || '').localeCompare(b.company || '');
    return (jobDate(b) ?? 0) - (jobDate(a) ?? 0);
  });
  return filtered;
}

function renderJobs() {
  const filtered = filterJobs();
  const el = document.getElementById('jobList');
  if (!filtered.length) {
    el.innerHTML = '<div class="loading">No jobs found</div>';
    document.getElementById('pagination').innerHTML = '';
    document.getElementById('stats').textContent = `${totalJobs} jobs`;
    return;
  }

  const start = (state.page - 1) * state.limit;
  const pageJobs = filtered.slice(start, start + state.limit);
  el.innerHTML = pageJobs.map(j => `
    <div class="job-card" onclick="window.open('${esc(j.url)}', '_blank')">
      <div class="job-title">${esc(j.title || j.job_title || 'Untitled')}</div>
      <div class="job-meta">
        ${j.company && j.company !== 'N/A' ? `<span>${esc(j.company)}</span>` : ''}
        ${j.work_type || j.type ? `<span class="badge">${esc(j.work_type || j.type)}</span>` : ''}
        ${j.salary_detail && j.salary_detail !== 'N/A' ? `<span class="salary">${esc(j.salary_detail)}</span>` : j.salary && j.salary !== 'N/A' ? `<span class="salary">${esc(j.salary)}</span>` : ''}
        ${j.posted ? `<span>${esc(j.posted)}</span>` : ''}
        ${j.category ? `<span class="badge">${esc(j.category)}</span>` : ''}
      </div>
    </div>
  `).join('');

  renderPagination(filtered.length);
  document.getElementById('stats').textContent =
    `${filtered.length} shown of ${totalJobs} jobs`;
}

function renderPagination(total) {
  const totalPages = Math.max(1, Math.ceil(total / state.limit));
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }

  const pages = [];
  const start = Math.max(1, state.page - 4);
  const end = Math.min(totalPages, start + 9);
  for (let i = start; i <= end; i++) pages.push(i);

  let html = `<button ${state.page <= 1 ? 'disabled' : ''} onclick="goPage(${state.page - 1})">Prev</button>`;
  html += pages.map(i => `<button class="${i === state.page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`).join('');
  html += `<button ${state.page >= totalPages ? 'disabled' : ''} onclick="goPage(${state.page + 1})">Next</button>`;
  el.innerHTML = html;
}

function goPage(p) {
  state.page = p;
  renderJobs();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function populateCategories() {
  if (!allJobs.length) return;
  const cats = new Map();
  for (const j of allJobs) {
    const c = j.category || 'Other';
    cats.set(c, (cats.get(c) || 0) + 1);
  }
  const ordered = CATEGORY_ORDER
    .filter(c => cats.has(c))
    .concat([...cats.keys()].filter(c => !CATEGORY_ORDER.includes(c)).sort());
  const select = document.getElementById('category');
  select.innerHTML = '<option value="">All Categories</option>' +
    ordered.map(c => `<option value="${esc(c)}">${esc(c)} (${cats.get(c)})</option>`).join('');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

document.getElementById('search').addEventListener('input', (e) => {
  state.search = e.target.value;
  state.page = 1;
  renderJobs();
});

document.getElementById('category').addEventListener('change', (e) => {
  state.category = e.target.value;
  state.page = 1;
  renderJobs();
});

document.getElementById('sort').addEventListener('change', (e) => {
  state.sort = e.target.value;
  state.page = 1;
  renderJobs();
});

(async () => {
  try {
    await loadAllJobs();
    populateCategories();
    renderJobs();
  } catch (err) {
    document.getElementById('jobList').innerHTML =
      '<div class="loading">Failed to load job data</div>';
    document.getElementById('stats').textContent = 'Unavailable';
    console.error(err);
  }
})();
</script>
</body>
</html>
