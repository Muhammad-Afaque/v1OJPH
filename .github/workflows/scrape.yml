name: Scrape & Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The CLOUDFLARE_* D1 credentials are stored as ENVIRONMENT secrets on the
    # "Production" environment, so this job must reference that environment for
    # the ${{ secrets.* }} expressions below to resolve. Job-level environment
    # selection uses the environment NAME, not its numeric id.
    environment: Production
    timeout-minutes: 360
    env:
      # Credentials for the D1 HTTP write path (set these in GitHub secret settings).
      # Never put real values here.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Run scraper pipeline (list → detail → categorize → write to D1)
        run: node dist/cli.js pipeline --keywords wordpress,shopify,seo

      # NOTE: Data now lives in D1, not the repo. Nothing is committed here.
      # If you want a local/backup copy on CI for inspection, run:
      #   node dist/cli.js pipeline --local-json
      # and uncomment the git-auto-commit step below.
      # - name: Commit updated data (optional local backup)
      #   uses: stefanzweifel/git-auto-commit-action@v5
      #   with:
      #     commit_message: 'chore: update scraped job data'
      #     file_pattern: 'jobs.json enriched_jobs.json'
